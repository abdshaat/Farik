name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  # One job, running the check with `--integration`, because the runner has git and Docker and the
  # flag's only effect is to include the tests marked `#[ignore]` for needing them. A second job
  # would compile the workspace again to run a superset of what this one ran; the Docker tests of
  # phase 3 step 02 only add ignored tests to the same `cargo test`, so they do not change that.
  # Their image is pulled first, because the sandbox never pulls one. The check also runs the front
  # end's `pnpm check` when the root has a `package.json`, so pnpm and Node are set up first.
  #
  # What that costs: nothing here runs `cargo xtask check` without the flag any more, so a break in
  # the flagless path — a test wrongly marked `#[ignore]` and so run by nobody's default command, or
  # the default arm itself — would reach `main` unseen. The command a contributor runs is what
  # guards it.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: git --version
      - run: docker pull alpine:3.22
      # The Designer's browser, the Playwright connector's image, by the digest playwright.yaml pins.
      - run: |
          docker pull "$(sed -n 's/^image: //p' crates/roles/connectors/playwright.yaml)"
      # The browser journey's Chromium, which Playwright downloads rather than finds on the runner.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @farik/web exec playwright install --with-deps chromium
      - run: cargo xtask check --integration
