[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/abdshaat/Farik"
rust-version = "1.98.1"

[workspace.dependencies]
anyhow = "=1.0.104"
# IMAP for the procurement mailbox (step 10f): a reader that never marks a message read. Tokio runtime, not async-std.
async-imap = { version = "=0.12.0", default-features = false, features = ["runtime-tokio"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
base64 = "=0.23.1"
calamine = { version = "=0.36.1", default-features = false }
chrono = { version = "=0.4.45", features = ["serde"] }
clap = { version = "=4.6.7", features = ["derive"] }
farik-core = { path = "crates/core" }
farik-protocol = { path = "crates/protocol" }
farik-roles = { path = "crates/roles" }
farik-runtime = { path = "crates/runtime" }
farik-store = { path = "crates/store" }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink"] }
globset = { version = "=0.4.20", default-features = false }
http = "=1.5.0"
# SMTP for the procurement mailbox (step 10f), over rustls with the platform verifier (not native-tls).
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "aws-lc-rs"] }
# Parses the replies read from the procurement mailbox (step 10f).
mail-parser = "=0.11.9"
jsonschema = { version = "=0.56.0", default-features = false }
keyring = "=4.2.0"
# Only for its in-memory mock store, standing in for the OS keychain in tests.
keyring-core = "=1.0.0"
# Already locked through rmcp; direct for Farik's own PKCE sign-in: the verifier, its S256 challenge and `state`.
oauth2 = { version = "=5.0.0", default-features = false }
regress = "=0.12.0"
# Already locked through rmcp; direct for the https-only OAuth client and the token form POSTs.
reqwest = { version = "=0.13.5", default-features = false, features = ["form"] }
rmcp = { version = "=3.3.0", default-features = false, features = ["auth", "client", "reqwest", "server", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
rpassword = "=7.5.4"
# Already locked through other crates; direct for the mailbox connections (step 10f).
rustls-platform-verifier = "=0.7.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rust-embed = { version = "=8.12.0", features = ["mime-guess"] }
rust_xlsxwriter = { version = "=0.99.1", default-features = false }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde-saphyr = "=1.3.0"
serde_json = "=1.0.151"
sha2 = "=0.11.0"
# Already locked through tokio; direct for the sign-in's callback listener, which `shutdown` stops listening for every copy of its socket (`unsafe_code` is forbidden, so no `libc`).
socket2 = "=0.6.5"
tokio = { version = "=1.53.1", default-features = false }
# Already locked through other crates; direct for the mailbox connections (step 10f).
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws-lc-rs"] }
tokio-tungstenite = "=0.29.0"
tokio-util = { version = "=0.7.19", default-features = false }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
typify = "=0.8.0"
# Already locked through reqwest and rmcp; direct for matching a server's address to a registered app.
url = "=2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
