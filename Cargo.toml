[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/abdshaat/Farik"
rust-version = "1.98.1"

[workspace.dependencies]
anyhow = "=1.0.104"
chrono = { version = "=0.4.45", features = ["serde"] }
clap = { version = "=4.6.7", features = ["derive"] }
farik-core = { path = "crates/core" }
farik-protocol = { path = "crates/protocol" }
farik-roles = { path = "crates/roles" }
farik-runtime = { path = "crates/runtime" }
farik-store = { path = "crates/store" }
globset = { version = "=0.4.20", default-features = false }
jsonschema = { version = "=0.56.0", default-features = false }
regress = "=0.12.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde-saphyr = "=1.3.0"
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", default-features = false }
typify = "=0.8.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
