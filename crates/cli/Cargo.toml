[package]
name = "farik"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "farik"
path = "src/lib.rs"

[[bin]]
name = "farik"
path = "src/main.rs"

[[bin]]
name = "farik-e2e-serve"
path = "src/bin/farik-e2e-serve.rs"
required-features = ["e2e"]

[features]
# The end-to-end binary, which replays recorded sessions; the shipped `farik` has no path to.
e2e = []

[dependencies]
chrono.workspace = true
clap.workspace = true
farik-core.workspace = true
farik-protocol.workspace = true
farik-runtime.workspace = true
farik-store.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }

[dev-dependencies]
futures-util.workspace = true
tokio-tungstenite.workspace = true

[lints]
workspace = true
