apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report
spec:
  schedule: "15 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: idle
spec:
  jobTemplate: {}
