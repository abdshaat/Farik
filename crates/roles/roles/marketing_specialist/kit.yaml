      image_to_image: "change an image"
      vectorize_image: "turn an image into vector art"
      remove_background: "remove a background"
      replace_background: "swap a background"
      crisp_upscale: "sharpen an image"
      creative_upscale: "upscale and redraw an image"
      create_style: "save a brand style"
      get_user: "check credits"
