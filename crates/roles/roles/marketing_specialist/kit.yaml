  - name: recraft
    transport: http
    url: https://mcp.recraft.ai/mcp
    oauth: { scopes: [openid, email, profile] }
    title: Recraft
    about: "Recraft makes images, logos and vector graphics in a consistent brand style."
    why: "So the Marketing Specialist can make on-brand graphics, icons and vector art. Each one uses your Recraft credits, so Farik counts them and asks you before going past the number you allow."
    setup: "Sign in with your Recraft account and allow Farik to use it. Every graphic your agent makes uses your Recraft credits; you choose how many it may make without asking. Farik counts each request, and one request can hold up to six pictures. Recraft may ask you to sign in again from time to time."
