# The Marketing Specialist's kit: eight skills written for any business (ADR 0040) and the creative
# services it signs in to (route 1, ADR 0035), each spending the user's credits inside an allowance
# (ADR 0037). Tool lists are pinned against each service's live listing by `live_kit_pins`; a tool a
# service lists that is not here is never offered (`tool_not_tagged`) until a pin update tags it.
role: marketing_specialist
skills:
  - positioning-and-messaging
  - planning-a-launch
  - writing-for-search
  - writing-in-the-brands-voice
  - keeping-a-content-calendar
  - researching-competitors
  - measuring-campaigns
  - making-images-and-video
connectors:
  - name: higgsfield
    transport: http
    url: https://mcp.higgsfield.ai/mcp
    oauth: { scopes: [openid, email, offline_access] }
    title: Higgsfield
    about: "Higgsfield makes images, short videos and voice-overs from a description, with many AI models in one account."
    why: "So the Marketing Specialist can make the pictures and clips a launch or a listing needs. Each one uses your Higgsfield credits, so Farik counts them and asks you before going past the number you allow."
    setup: "Higgsfield needs a paid plan for this. Sign in with your Higgsfield account and allow Farik to use it. Every picture or clip your agent makes uses your Higgsfield credits; you choose how many it may make without asking. Farik counts each request, a price check included, and one request can hold up to four pictures."
    labels:
      generate_image: "make an image"
      generate_video: "make a video or check its price"
      generate_audio: "make a voice-over"
      upscale_image: "sharpen an image"
      remove_background: "remove a background"
      outpaint_image: "extend an image"
      generate_image_batch: "make several images"
      generate_video_batch: "make several videos"
      generate_audio_batch: "make several voice-overs"
      generate_3d: "make a 3D model"
      upscale_video: "sharpen a video"
      reframe: "change a video's shape"
      motion_control: "animate a picture from a clip"
      dubbing: "dub a video"
      voice_change: "change a video's voice"
      ads_studio_generate: "make a set of ads"
      ads_studio_create_brand: "research a brand for ads"
      ads_studio_add_product: "add a product for ads"
      ads_studio_update_product: "change a product for ads"
      ads_studio_cancel_run: "stop an ad set"
      ai_influencer_generate: "make a character sheet"
      execute_preset: "run a preset"
      media_import_url: "bring in a picture from the web"
      resolve_explainer_preset: "pick an explainer style"
      shorts_studio_create: "restyle a video into shorts"
      shorts_studio_create_preset: "save a shorts style"
      video_analysis_create: "analyse a video"
      virality_predictor: "predict a video's reach"
      models_explore: "find a model"
      balance: "check credits"
      transactions: "read credit use"
      get_presets: "browse presets"
      show_generations: "read past generations"
      show_generation_by_ids: "read generations"
      job_display: "read a generation"
      jobs_wait: "wait for generations"
    allowances:
      generate_image: { calls: 20, what: "images" }
      generate_video: { calls: 6, what: "video requests" }
      generate_audio: { calls: 10, what: "voice clips" }
      upscale_image: { calls: 10, what: "image upscales" }
      remove_background: { calls: 10, what: "background removals" }
      outpaint_image: { calls: 10, what: "image extensions" }
    tools:
