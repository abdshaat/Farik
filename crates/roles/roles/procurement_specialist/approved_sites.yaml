# Farik's approved sites (ADR 0039, spec 6.10): long-established shops across the categories a small
# business buys in, each by its primary domain, which every team's Procurement Specialist may read
# from its first task without asking. Public data, not a secret. The first version, compiled on
# 2026-10-07; the launch review (phase 11 step 02) finalizes it. A regional domain is a host of its
# own, and a site is matched exactly: a host and its www. twin, never its other subdomains.
