[package]
name = "farik-runtime"
description = "Agent sessions behind one adapter trait: the Claude Code program, recorded transcripts, and what a session reports."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The end-to-end server's `--preview` admission (step 12, D1), switched on only by `farik`'s `e2e`,
# so that the release binary does not have it.
e2e = []

[dependencies]
axum.workspace = true
base64.workspace = true
calamine.workspace = true
chrono.workspace = true
farik-core.workspace = true
farik-protocol.workspace = true
farik-roles.workspace = true
farik-store.workspace = true
http.workspace = true
keyring.workspace = true
oauth2.workspace = true
reqwest.workspace = true
rmcp.workspace = true
rust-embed.workspace = true
rust_xlsxwriter.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
url.workspace = true

[dev-dependencies]
futures-util.workspace = true
jsonschema.workspace = true
keyring-core.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
tower.workspace = true

[lints]
workspace = true
