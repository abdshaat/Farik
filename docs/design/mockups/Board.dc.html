<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Silkscreen&amp;family=Space+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Space Grotesk',system-ui,sans-serif;background:#F3E7D3;color:#161616}
a{color:#A44D2B}a:hover{color:#7E3A1F}
.px{image-rendering:pixelated}
button:focus-visible,a:focus-visible{outline:2px solid #5A8DFF;outline-offset:2px}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #F3E7D3; color: #161616; font-family: 'Space Grotesk', system-ui, sans-serif;">

<nav aria-label="Main" style="width: 88px; flex-shrink: 0; background: #161616; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px 0; box-sizing: border-box;">
<img class="px" src="/_blob/cbf211abf5739b5bb073797fe4fb08fc" alt="Farik" style="width: 48px; height: 48px; margin-bottom: 16px;">
<a href="Main.dc.html" style="width: 72px; padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #B9AE9C; text-decoration: none; font-size: 12px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>Today</a>
<a href="#" aria-current="page" style="width: 72px; padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #F3E7D3; background: #2A2A2A; border-radius: 4px; text-decoration: none; font-size: 12px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="5" height="16"></rect><rect x="10" y="4" width="5" height="10"></rect><rect x="17" y="4" width="4" height="13"></rect></svg>Board</a>
<a href="Channel.dc.html" style="width: 72px; padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #B9AE9C; text-decoration: none; font-size: 12px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>Channel</a>
<a href="Team.dc.html" style="width: 72px; padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #B9AE9C; text-decoration: none; font-size: 12px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><circle cx="17" cy="9" r="2.5"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 20c0-2.2 1.3-4.2 3.5-4.8"></path></svg>Team</a>
<a href="Costs.dc.html" style="width: 72px; padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #B9AE9C; text-decoration: none; font-size: 12px;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v2M12 16v2"></path></svg>Costs</a>
</nav>

<main style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0; padding: 32px 40px; gap: 20px; box-sizing: border-box;">
<div style="display: flex; align-items: center; gap: 16px;">
<h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 600;">Board</h1>
<span style="font-size: 16px; color: #5B5347;">Sprint 2 is running: 4 of 7 tasks done</span>
<span style="flex-grow: 1;"></span>
<button type="button" style="font-family: inherit; font-size: 16px; font-weight: 600; background: transparent; color: #161616; border: 1px solid #161616; border-radius: 4px; padding: 10px 16px; cursor: pointer;">End the sprint early</button>
</div>

<div role="group" aria-label="Show tasks for" style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
<button type="button" aria-pressed="true" style="font-family: inherit; font-size: 14px; font-weight: 600; background: #161616; color: #F3E7D3; border: 1px solid #161616; border-radius: 4px; padding: 7px 12px;">Everyone</button>
<button type="button" aria-pressed="false" style="font-family: inherit; font-size: 14px; background: transparent; color: #161616; border: 1px solid #8A7F6E; border-radius: 4px; padding: 3px 12px 3px 4px; display: flex; align-items: center; gap: 8px;"><img class="px" src="/_blob/869069a768cb33e45c8bb866b20acd01" alt="" style="width: 28px; height: 28px;">Mira</button>
<button type="button" aria-pressed="false" style="font-family: inherit; font-size: 14px; background: transparent; color: #161616; border: 1px solid #8A7F6E; border-radius: 4px; padding: 3px 12px 3px 4px; display: flex; align-items: center; gap: 8px;"><img class="px" src="/_blob/5defe7847440351388f344c77c64ce95" alt="" style="width: 28px; height: 28px;">Theo</button>
<button type="button" aria-pressed="false" style="font-family: inherit; font-size: 14px; background: transparent; color: #161616; border: 1px solid #8A7F6E; border-radius: 4px; padding: 3px 12px 3px 4px; display: flex; align-items: center; gap: 8px;"><img class="px" src="/_blob/2099d2edd3191152cc1f897883c205cf" alt="" style="width: 28px; height: 28px;">Kai</button>
<span style="width: 1px; height: 24px; background: #D9CBB3; margin: 0 8px;"></span>
<button type="button" aria-pressed="false" style="font-family: inherit; font-size: 14px; background: transparent; color: #161616; border: 1px solid #8A7F6E; border-radius: 4px; padding: 7px 12px;">Only what is waiting on me</button>
<button type="button" aria-pressed="false" style="font-family: inherit; font-size: 14px; background: transparent; color: #161616; border: 1px solid #8A7F6E; border-radius: 4px; padding: 7px 12px;">Gift cards</button>
</div>

<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; border-top: 1px solid #161616;">
<sc-for list="{{lanes}}" as="lane" hint-placeholder-count="6">
<section style="display: flex; flex-direction: column; gap: 0; padding: 14px 14px 0; border-right: 1px solid #D9CBB3;">
<h2 style="margin: 0 0 10px; font-size: 16px; line-height: 24px; font-weight: 600; display: flex; gap: 8px; align-items: baseline;">{{lane.name}} <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 400; color: #5B5347;">{{lane.count}}</span></h2>
<sc-for list="{{lane.tasks}}" as="task" hint-placeholder-count="2">
<a href="{{task.href}}" style="display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid #D9CBB3; color: #161616; text-decoration: none;">
<img class="px" src="{{task.av}}" alt="{{task.who}}" style="width: 32px; height: 32px; flex-shrink: 0;">
<span style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
<span style="font-size: 15px; line-height: 20px; font-weight: 500;">{{task.title}}</span>
<span style="display: flex; gap: 8px; align-items: center; font-size: 13px;"><span style="font-family: 'JetBrains Mono', monospace; color: #5B5347;">{{task.id}}</span><span style="font-weight: 600; color: {{task.markColor}};">{{task.mark}}</span></span>
</span>
</a>
</sc-for>
<sc-if value="{{lane.empty}}" hint-placeholder-val="{{ false }}"><p style="margin: 12px 0 0; font-size: 14px; line-height: 20px; color: #5B5347;">Nobody is stuck.</p></sc-if>
</section>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var pm = '/_blob/869069a768cb33e45c8bb866b20acd01', dev = '/_blob/5defe7847440351388f344c77c64ce95', mkt = '/_blob/2099d2edd3191152cc1f897883c205cf', sm = '/_blob/b5b337cd4be20e26bbb640893ac8fa9b';
    var coral = '#A44D2B', moss = '#536C59', blue = '#0653FF', muted = '#5B5347';
    function t(id, title, who, av, mark, markColor, href) { return { id: id, title: title, who: who, av: av, mark: mark || '', markColor: markColor || muted, href: href || '#' }; }
    var lanes = [
      { name: 'Planning', tasks: [t('E-3', 'Gift cards', 'Mira', pm, 'Waiting on you', coral), t('T-19', 'Holiday opening hours', 'Mira', pm, 'Asking you a question', coral)] },
      { name: 'To do', tasks: [t('T-17', 'Email a receipt after paying', 'Theo', dev), t('T-18', 'Photo for the gift card page', 'Kai', mkt)] },
      { name: 'In progress', tasks: [t('T-16', 'Launch post for gift cards', 'Kai', mkt, 'Writing', blue), t('T-15', 'Show sold-out items', 'Theo', dev, 'Being reworked', blue)] },
      { name: 'Stuck', tasks: [] },
      { name: 'Review', tasks: [t('T-14', 'New checkout page', 'Theo', dev, 'Waiting on you', coral, 'Gate.dc.html')] },
      { name: 'Done', tasks: [t('T-12', 'New photos on the menu page', 'Theo', dev, 'Accepted', moss), t('T-11', 'Standup notes in the channel', 'Sol', sm, 'Accepted', moss)] }
    ];
    lanes.forEach(function (l) { l.count = String(l.tasks.length); l.empty = l.tasks.length === 0; });
    return { lanes: lanes };
  }
}
</script>
</body>
</html>
