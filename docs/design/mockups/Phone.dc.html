<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Silkscreen&amp;family=Space+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Space Grotesk',system-ui,sans-serif;background:#F3E7D3;color:#161616}
a{color:#A44D2B}
.px{image-rendering:pixelated}
.cursor{display:inline-block;width:9px;height:18px;background:#6E8F76;vertical-align:-3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F3E7D3; color: #161616; font-family: 'Space Grotesk', system-ui, sans-serif; overflow: hidden;">

<section aria-label="Your team" style="background: #161616; color: #F3E7D3; padding: 20px 0 20px 16px; display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; align-items: center; gap: 12px; padding-right: 16px;">
<img class="px" src="/_blob/cbf211abf5739b5bb073797fe4fb08fc" alt="Farik" style="width: 32px; height: 32px;">
<h1 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; flex-grow: 1;">Corner Bakery orders</h1>
</div>
<div style="display: flex; gap: 14px; overflow-x: auto;">
<sc-for list="{{team}}" as="m" hint-placeholder-count="5">
<div style="width: 76px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px;">
<sc-if value="{{m.hasArt}}" hint-placeholder-val="{{ true }}"><img class="px" src="{{m.av}}" alt="" style="width: 56px; height: 56px; border: 3px solid {{m.tag}};"></sc-if>
<sc-if value="{{m.noArt}}" hint-placeholder-val="{{ false }}"><img class="px" src="/_blob/ad487f8d4aefebda16a64e156d704fdb" alt="" style="width: 56px; height: 56px; border: 3px solid #E3B04B; flex-shrink: 0; box-sizing: content-box;"></sc-if>
<span style="font-size: 14px; font-weight: 600;">{{m.name}}</span>
<span style="font-size: 12px; line-height: 16px; text-align: center; color: {{m.statusColor}};">{{m.status}}</span>
</div>
</sc-for>
</div>
</section>

<div style="flex-grow: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 24px; overflow: hidden;">
<form style="background: #FBF6EC; border: 1px solid #8A7F6E; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 12px;">
<label for="askm" style="font-size: 16px; font-weight: 600;">What should the team do next?</label>
<div style="display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 15px;">
<span aria-hidden="true" style="color: #A44D2B; font-weight: 600;">&gt;</span>
<input id="askm" type="text" placeholder="Let customers buy gift cards" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #161616; padding: 4px 0;">
<span class="cursor" aria-hidden="true"></span>
</div>
<button type="button" style="font-family: inherit; font-size: 16px; font-weight: 600; background: #D8896A; color: #161616; border: 0; border-radius: 4px; padding: 12px; cursor: pointer;">Send to the team</button>
</form>

<section aria-labelledby="wm" style="display: flex; flex-direction: column;">
<h2 id="wm" style="margin: 0 0 4px; font-size: 18px; line-height: 24px; font-weight: 600;">Waiting on you <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #A44D2B;">3</span></h2>
<sc-for list="{{waiting}}" as="w" hint-placeholder-count="3">
<a href="{{w.href}}" style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #D9CBB3; color: #161616; text-decoration: none; min-height: 44px;">
<img class="px" src="{{w.av}}" alt="" style="width: 40px; height: 40px; flex-shrink: 0;">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 16px; font-weight: 600;">{{w.title}}</span><span style="font-size: 14px; line-height: 20px; color: #5B5347;">{{w.sub}}</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#161616" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</sc-for>
</section>
</div>

<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #161616; padding: 8px 4px 14px;">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
<a href="#" aria-current="{{tab.current}}" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; min-height: 44px; box-sizing: border-box; color: {{tab.color}}; text-decoration: none; font-size: 12px; font-weight: {{tab.weight}};"><span style="width: 20px; height: 3px; background: {{tab.bar}};"></span>{{tab.label}}</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var pm = '/_blob/9bb5279ccb2c1912098a3a1b2c486aee', sm = '/_blob/50d64e70d63028a36a09a3b10dd330bb', dev = '/_blob/b3a8b1467a4f9ce051ca665a72525186', mkt = '/_blob/d639a95a4e1c0d33f55ba49d10828138';
    function m(name, av, tag, status, waiting) { return { name: name, av: av || '', tag: tag, status: status, hasArt: !!av, noArt: !av, statusColor: waiting ? '#D8896A' : '#B9AE9C' }; }
    var tabs = ['Today', 'Board', 'Channel', 'Team', 'Costs'].map(function (l, i) {
      return { label: l, current: i === 0 ? 'page' : 'false', color: i === 0 ? '#F3E7D3' : '#B9AE9C', weight: i === 0 ? '600' : '400', bar: i === 0 ? '#D8896A' : 'transparent' };
    });
    return {
      team: [m('Theo', dev, '#5A8DFF', 'Waiting on you', true), m('Mira', pm, '#D8896A', 'Planning'), m('Kai', mkt, '#A99BF0', 'Writing'), m('Sol', sm, '#6E8F76', 'Standup posted'), m('Ada', '/_blob/ad487f8d4aefebda16a64e156d704fdb', '#E3B04B', 'Resting')],
      waiting: [
        { title: 'Accept the checkout page', sub: 'All 5 checks passed', av: dev, href: 'Gate.dc.html' },
        { title: 'Approve the gift card plan', sub: 'A plan in 4 parts', av: pm, href: '#' },
        { title: 'Kai has a question', sub: 'About the holiday hours', av: mkt, href: '#' }
      ],
      tabs: tabs
    };
  }
}
</script>
</body>
</html>
