<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open your app, on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Silkscreen&amp;family=Space+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Space Grotesk',system-ui,sans-serif;background:#F3E7D3;color:#161616}
a{color:#161616;text-decoration:underline;text-underline-offset:3px}a:hover{color:#5B5347}
.px{image-rendering:pixelated}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #5F7A9B;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F3E7D3; color: #161616; font-family: 'Space Grotesk', system-ui, sans-serif; overflow: hidden;">
<section aria-label="Your team" style="background: #161616; color: #F3E7D3; padding: 20px 0 20px 16px; display: flex; flex-direction: column; gap: 16px; flex-shrink: 0;">
<div style="display: flex; align-items: center; gap: 12px; padding-right: 16px;">
<img class="px" src="/_blob/cbf211abf5739b5bb073797fe4fb08fc" alt="Catervas" style="width: 32px; height: 32px;">
<h1 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600; flex-grow: 1;">Corner Bakery orders</h1>
</div>
<div style="display: flex; gap: 14px; overflow-x: auto;">
<sc-for list="{{team}}" as="m" hint-placeholder-count="6">
<div style="width: 76px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px;">
<img class="px" src="{{m.av}}" alt="" style="width: 56px; height: 56px; border: 3px solid {{m.tag}};">
<span style="font-size: 14px; font-weight: 600;">{{m.name}}</span>
<span style="font-size: 12px; line-height: 16px; text-align: center; color: {{m.statusColor}};">{{m.status}}</span>
</div>
</sc-for>
</div>
</section>
<div style="flex-grow: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 24px; overflow-y: auto;">
<section aria-labelledby="wm" style="display: flex; flex-direction: column;">
<h2 id="wm" style="margin: 0 0 4px; font-size: 18px; line-height: 24px; font-weight: 600;">Waiting on you <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #96533A;">2</span></h2>
<sc-for list="{{waiting}}" as="w" hint-placeholder-count="2">
<a href="{{w.href}}" style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #D9CBB3; color: #161616; text-decoration: none; min-height: 44px;">
<img class="px" src="{{w.av}}" alt="" style="width: 40px; height: 40px; flex-shrink: 0;">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 16px; font-weight: 600;">{{w.title}}</span><span style="font-size: 14px; line-height: 20px; color: #5B5347;">{{w.sub}}</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#161616" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</sc-for>
</section>
</div>
<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #161616; padding: 8px 4px 14px; flex-shrink: 0;">
<a href="Phone.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; min-height: 44px; box-sizing: border-box; color: #F3E7D3; text-decoration: none; font-size: 12px; font-weight: 600;"><span style="width: 20px; height: 3px; background: #D8896A;"></span>Today</a>
<a href="PhoneBoard.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; min-height: 44px; box-sizing: border-box; color: #B9AE9C; text-decoration: none; font-size: 12px; font-weight: 400;"><span style="width: 20px; height: 3px; background: transparent;"></span>Board</a>
<a href="PhoneChannel.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; min-height: 44px; box-sizing: border-box; color: #B9AE9C; text-decoration: none; font-size: 12px; font-weight: 400;"><span style="width: 20px; height: 3px; background: transparent;"></span>Channel</a>
<a href="Team.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; min-height: 44px; box-sizing: border-box; color: #B9AE9C; text-decoration: none; font-size: 12px; font-weight: 400;"><span style="width: 20px; height: 3px; background: transparent;"></span>Team</a>
<a href="Costs.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; min-height: 44px; box-sizing: border-box; color: #B9AE9C; text-decoration: none; font-size: 12px; font-weight: 400;"><span style="width: 20px; height: 3px; background: transparent;"></span>Costs</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
    function m(name, av, tag, status, waiting) { return { name: name, av: av, tag: tag, status: status, statusColor: waiting ? '#E0A68C' : '#B9AE9C' }; }
    return {
      team: [m('Iris', '/_blob/96fd70a6ba3c33c0c1f22ba8c032b059', '#9EC3BE', 'Waiting on you', true), m('Mira', '/_blob/9bb5279ccb2c1912098a3a1b2c486aee', '#C9A0A6', 'Planning'), m('Theo', '/_blob/b3a8b1467a4f9ce051ca665a72525186', '#B7C7DA', 'Building'), m('Kai', '/_blob/d639a95a4e1c0d33f55ba49d10828138', '#B3A9CF', 'Writing'), m('Sol', '/_blob/50d64e70d63028a36a09a3b10dd330bb', '#A3B8A0', 'Standup posted'), m('Ada', '/_blob/ad487f8d4aefebda16a64e156d704fdb', '#D6B77A', 'Resting')],
      waiting: [
        { title: 'Tell Catervas how to open your app', sub: 'Iris needs it to look at your screens', av: '/_blob/96fd70a6ba3c33c0c1f22ba8c032b059', href: 'SettingsPreview.dc.html' },
        { title: 'Approve the gift card plan', sub: 'A plan in 4 parts', av: '/_blob/9bb5279ccb2c1912098a3a1b2c486aee', href: '#' }
      ]
    };
}
}
</script>
</body>
</html>
